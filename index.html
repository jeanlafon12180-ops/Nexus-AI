<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Nexus AI V0.6 — assistant web intelligent en développement.">
<title>Nexus AI V0.6</title>
<style>
:root{--bg:#070b14;--panel:#0f172a;--panel2:#172033;--border:#263449;--text:#f8fafc;--muted:#94a3b8;--accent:#2563eb;--accent2:#1d4ed8;--user:#1d4ed8;--nexus:#243247}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at top,#18233a 0%,var(--bg) 55%);color:var(--text);display:flex;justify-content:center;padding:18px}.app{width:min(1120px,100%);min-height:calc(100vh - 36px);display:grid;grid-template-columns:240px 1fr;background:rgba(15,23,42,.97);border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,.45)}.sidebar{border-right:1px solid var(--border);padding:20px;background:rgba(7,11,20,.65)}.brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent);font-size:22px}.brand h1{margin:0;font-size:19px}.brand span{color:var(--muted);font-size:12px}.side-title{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:18px 0 8px}.side-button{width:100%;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:11px 12px;border-radius:11px;cursor:pointer;text-align:left;margin-bottom:8px}.side-button:hover{border-color:#60a5fa}.main{display:flex;flex-direction:column;min-width:0}.topbar{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.status{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}.dot{width:9px;height:9px;background:#22c55e;border-radius:50%;box-shadow:0 0 10px #22c55e}.version{font-size:13px;color:#cbd5e1;border:1px solid var(--border);padding:7px 10px;border-radius:999px}.chat{flex:1;overflow-y:auto;padding:24px}.message-row{display:flex;margin-bottom:16px}.message-row.user{justify-content:flex-end}.bubble{max-width:min(780px,90%);padding:13px 16px;border-radius:17px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.nexus{background:var(--nexus);border-bottom-left-radius:5px}.bubble.user{background:var(--user);border-bottom-right-radius:5px}.typing{opacity:.75;font-style:italic}.suggestions{display:flex;gap:8px;flex-wrap:wrap;padding:0 24px 12px}.suggestion{border:1px solid var(--border);background:var(--panel2);color:#dbeafe;border-radius:999px;padding:8px 12px;cursor:pointer}.suggestion:hover{border-color:#60a5fa}.composer{padding:15px;border-top:1px solid var(--border);background:rgba(7,11,20,.8)}.input-wrap{display:flex;gap:10px;align-items:stretch}#messageInput{flex:1;resize:none;min-height:52px;max-height:190px;border:1px solid var(--border);outline:none;border-radius:14px;background:var(--panel2);color:var(--text);padding:14px;font-size:16px}#messageInput:focus{border-color:#3b82f6}#sendButton{width:58px;border:0;border-radius:14px;background:var(--accent);color:white;font-size:20px;cursor:pointer}#sendButton:hover{background:var(--accent2)}#sendButton:disabled{opacity:.55;cursor:not-allowed}.hint{color:var(--muted);font-size:11px;margin-top:8px;text-align:center}@media(max-width:820px){body{padding:0}.app{grid-template-columns:1fr;min-height:100vh;border-radius:0}.sidebar{display:none}.chat{padding:16px}.suggestions{padding:0 16px 10px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><div class="logo">🤖</div><div><h1>Nexus AI</h1><span>Assistant intelligent</span></div></div>
<div class="side-title">Outils</div>
<button class="side-button" id="memoryButton">🧠 Ma mémoire</button>
<button class="side-button" id="clearButton">🧹 Effacer la conversation</button>
<button class="side-button" id="helpButton">❓ Aide</button>
<button class="side-button" id="clearMemoryButton">🗑️ Effacer ma mémoire</button>
<div class="side-title">V0.6</div>
<div style="color:#94a3b8;font-size:13px;line-height:1.6">Correctifs, tolérance aux fautes, calculs en langage naturel, mémoire plus robuste et traitement de plusieurs questions.</div>
</aside>
<main class="main">
<header class="topbar"><div class="status"><span class="dot"></span> Nexus est en ligne</div><div class="version">Nexus AI v0.6</div></header>
<section id="chat" class="chat" aria-live="polite"></section>
<div class="suggestions"><button class="suggestion">Que peux-tu faire ?</button><button class="suggestion">Je m'appelle Jean</button><button class="suggestion">Calcule 25 divisé par 48</button><button class="suggestion">Qui suis-je ?</button></div>
<footer class="composer"><div class="input-wrap"><textarea id="messageInput" placeholder="Écris ton message à Nexus AI...&#10;Tu peux coller plusieurs questions, une par ligne." rows="1"></textarea><button id="sendButton" aria-label="Envoyer">➤</button></div><div class="hint">Entrée = envoyer • Maj + Entrée = nouvelle ligne • Plusieurs lignes = plusieurs réponses</div></footer>
</main>
</div>
<script>
const MEMORY_KEY='nexus_ai_memory',CHAT_KEY='nexus_ai_conversation';
let memory=loadJson(MEMORY_KEY,{prenom:'',ville:'',notes:[]}),conversation=loadJson(CHAT_KEY,[]);
const chat=document.getElementById('chat'),input=document.getElementById('messageInput'),sendButton=document.getElementById('sendButton');
function loadJson(k,f){try{const r=localStorage.getItem(k);return r?{...f,...JSON.parse(r)}:f}catch{return f}}
function saveJson(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function saveMemory(){saveJson(MEMORY_KEY,memory)}
function saveConversation(){saveJson(CHAT_KEY,conversation.slice(-120))}
function normalize(t){return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,' ').replace(/[!?.,;:()[\]{}]/g,' ').replace(/\s+/g,' ').trim()}
function levenshtein(a,b){if(a===b)return 0;if(!a)return b.length;if(!b)return a.length;let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(c[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]}
function closeToWord(t,w){return t.split(' ').some(x=>x.length>=3&&levenshtein(x,w)<=Math.min(2,Math.floor(w.length/2)))}
function any(t,a){return a.some(x=>t.includes(x))}
function getTime(){return new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit'}).format(new Date())}
function getDate(){return new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())}
function escapeName(v){return v.trim().replace(/\s+/g,' ').replace(/^./,c=>c.toUpperCase())}
function detectName(raw){const n=normalize(raw),p=[/^je m appelle (.+)$/, /^mon prenom est (.+)$/, /^moi c est (.+)$/, /^je suis appele (.+)$/];for(const q of p){const m=n.match(q);if(m){const name=escapeName(m[1].split(' ')[0]);if(name.length>=2&&name.length<=30){memory.prenom=name;saveMemory();return `Enchanté ${name} ! 👋 Je m'en souviendrai.`}}}const a=n.split(' ');if(a.length>=4&&(a[0]==='je'||a[0]==='j')&&(a[1]==='m'||closeToWord(a[1],'m'))){if(closeToWord(a[2],'appelle')||closeToWord(a[2],'apelle')){const name=escapeName(a[3]);if(name.length>=2){memory.prenom=name;saveMemory();return `Enchanté ${name} ! 👋 Je m'en souviendrai.`}}}return null}
function detectCity(raw){const n=normalize(raw),m=n.match(/^j habite a (.+)$/)||n.match(/^ma ville est (.+)$/)||n.match(/^je vis a (.+)$/);if(!m)return null;memory.ville=m[1].trim().split(' ').slice(0,4).join(' ').replace(/^./,c=>c.toUpperCase());saveMemory();return `D'accord ! 🏠 Je retiens que tu habites à ${memory.ville}.`}
function parseNum(w){const x={zero:0,un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10,onze:11,douze:12,treize:13,quatorze:14,quinze:15,seize:16,vingt:20,trente:30,quarante:40,cinquante:50,soixante:60,cent:100,mille:1000};return Object.prototype.hasOwnProperty.call(x,w)?x[w]:null}
function calculate(raw){let e=normalize(raw).replace(/divisee?\s+par/g,'/').replace(/multipliee?\s+par/g,'*').replace(/fois/g,'*').replace(/plus/g,'+').replace(/moins/g,'-').replace(/\bx\b/g,'/');e=e.split(' ').map(w=>{const n=parseNum(w);return n===null?w:String(n)}).join(' ');e=e.replace(/x/g,'*');if(!/^[0-9+\-*/().%\s]+$/.test(e))return null;try{const r=Function('"use strict";return ('+e+')')();return typeof r==='number'&&Number.isFinite(r)?Math.round(r*1e10)/1e10:null}catch{return null}}
function memoryReply(){const a=[];if(memory.prenom)a.push(`Prénom : ${memory.prenom}`);if(memory.ville)a.push(`Ville : ${memory.ville}`);return a.length?'🧠 Voici ce que je retiens :\n\n'+a.join('\n'):'🧠 Ma mémoire est encore vide.'}
function helpReply(){return `🤖 Nexus AI V0.6 peut maintenant :\n\n• comprendre plusieurs formulations\n• tolérer des petites fautes\n• retenir ton prénom et ta ville\n• conserver l'historique sur cet appareil\n• calculer avec des nombres et des mots comme « divisé par »\n• donner la date et l'heure\n• répondre à plusieurs questions collées en même temps\n\nTu peux coller par exemple 6 questions, une par ligne.`}
function knowledge(n){if((n.includes('france')&&(n.includes('capital')||n.includes('capitale')))||n.includes('capitale de la france'))return 'La capitale de la France est Paris. 🇫🇷';if(n.includes('planete la plus proche du soleil'))return 'La planète la plus proche du Soleil est Mercure. ☀️';if(n.includes('plus grand ocean'))return "Le plus grand océan de la Terre est l'océan Pacifique. 🌊";if(n.includes('vitesse lumiere'))return 'Dans le vide, la lumière se déplace à environ 299 792 km/s. ⚡';if(n.includes('eau bout'))return "Au niveau de la mer, l'eau bout à environ 100 °C. 🌡️";if(n.includes('python'))return 'Python est un langage de programmation très utilisé pour l’automatisation, la data, le Web et l’intelligence artificielle. 🐍';if(n.includes('html'))return 'HTML sert à structurer le contenu d’une page Web. 🌐';if(n.includes('javascript'))return 'JavaScript permet notamment de rendre les pages Web interactives. ⚙️';if(n.includes('github'))return 'GitHub permet notamment d’héberger du code et de suivre les versions d’un projet. 🐙';return null}
function answer(raw){const name=detectName(raw);if(name)return name;const city=detectCity(raw);if(city)return city;const n=normalize(raw);if(any(n,['aide','que peux tu faire','que sais tu faire','tu peux faire quoi'])||(closeToWord(n,'faire')&&closeToWord(n,'peux')))return helpReply();if(any(n,['bonjour','salut','hello','coucou','bonsoir'])||closeToWord(n,'bonjour'))return memory.prenom?`Bonjour ${memory.prenom} ! 👋`:'Bonjour ! 👋';if(any(n,['qui es tu','qui est nexus','presente toi','tu es quoi']))return 'Je suis Nexus AI V0.6 🤖, un assistant Web en développement.';if(any(n,['qui suis je','tu sais qui je suis','quel est mon prenom','comment je m appelle']))return memory.prenom?`Tu es ${memory.prenom}. 🧠`: 'Je ne connais pas encore ton prénom. 🧠';if(any(n,['quelle heure','il est quelle heure','heure'])||closeToWord(n,'heure'))return `Il est ${getTime()} ⏰`;if(any(n,['quelle date','quel jour','date du jour'])||closeToWord(n,'date'))return `Nous sommes ${getDate()}. 📅`;if(any(n,['ca va','comment vas tu','tu vas bien']))return 'Je vais très bien ! 🤖';if(any(n,['merci','merci beaucoup'])||closeToWord(n,'merci'))return 'Avec plaisir ! 😄';if(any(n,['au revoir','aurevoir','bye']))return 'À bientôt ! 🚀';if(n==='memoire'||n.includes('montre ma memoire')||n.includes('que sais tu sur moi'))return memoryReply();if(n==='oublie tout'||n.includes('efface ma memoire')||n.includes('oublie moi')){memory={prenom:'',ville:'',notes:[]};saveMemory();return 'C’est fait. 🧹🧠 Ma mémoire locale a été effacée.'}if(/\d/.test(n)&&(n.includes('divise')||n.includes('multiplie')||n.includes('fois')||n.includes('plus')||n.includes('moins')||n.startsWith('calcule')||n.startsWith('calcul')||n.startsWith('combien'))) {const e=raw.replace(/^\s*(calcule?|calcul|combien font|combien fait)\s*/i,'');const r=calculate(e);if(r!==null)return `Le résultat est **${r}**. 🧮`;}const direct=calculate(n);if(direct!==null&&/\d/.test(n))return `Le résultat est **${direct}**. 🧮`;const k=knowledge(n);if(k)return k;return 'Je ne comprends pas encore complètement cette question. 🧠\n\nEssaie une formulation plus précise ou tape « aide ».'}
function format(t){return t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}
function render(sender,text,type,persist=true){const row=document.createElement('div');row.className='message-row '+type;const b=document.createElement('div');b.className='bubble '+type;b.innerHTML=format(text);row.appendChild(b);chat.appendChild(row);if(persist){conversation.push({sender,text,type,time:Date.now()});saveConversation()}chat.scrollTop=chat.scrollHeight}
function renderHistory(){chat.innerHTML='';if(!conversation.length){render('Nexus AI',`Bonjour${memory.prenom?' '+memory.prenom:''} ! 👋\n\nJe suis Nexus AI V0.6. Pose-moi une question pour commencer.`,'nexus',false)}else conversation.forEach(x=>render(x.sender,x.text,x.type,false))}
function typing(){const row=document.createElement('div');row.className='message-row nexus';row.id='typingRow';const b=document.createElement('div');b.className='bubble nexus typing';b.textContent='Nexus AI réfléchit…';row.appendChild(b);chat.appendChild(row);chat.scrollTop=chat.scrollHeight}

// Transforme un collage en questions indépendantes.
function splitQuestions(text){
    // 1. Priorité aux retours à la ligne : chaque ligne non vide devient une question.
    let lines=text.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);
    // Retire les puces et numéros de début de ligne.
    lines=lines.map(x=>x.replace(/^(?:[-•*]|\d+[.)])\s+/,'').trim()).filter(Boolean);
    if(lines.length>1)return lines;

    // 2. Sur une seule ligne, tente de découper les questions séparées par ? ou !
    const parts=text.split(/(?<=[?!])\s+/).map(x=>x.trim()).filter(Boolean);
    return parts.length>1?parts:lines;
}

function sendMessage(text=input.value){
    const questions=splitQuestions(text);
    if(!questions.length||sendButton.disabled)return;
    input.value='';input.style.height='auto';sendButton.disabled=true;
    questions.forEach(q=>render('Toi',q,'user'));
    let index=0;
    const answerNext=()=>{
        if(index>=questions.length){document.getElementById('typingRow')?.remove();sendButton.disabled=false;input.focus();return}
        document.getElementById('typingRow')?.remove();typing();
        const q=questions[index++];
        setTimeout(()=>{
            document.getElementById('typingRow')?.remove();
            render('Nexus AI',answer(q),'nexus');
            setTimeout(answerNext,120);
        },Math.min(700,Math.max(180,q.length*4)));
    };
    answerNext();
}

document.querySelectorAll('.suggestion').forEach(b=>b.addEventListener('click',()=>sendMessage(b.textContent)));
sendButton.addEventListener('click',()=>sendMessage());
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,190)+'px'});
document.getElementById('memoryButton').addEventListener('click',()=>render('Nexus AI',memoryReply(),'nexus'));
document.getElementById('helpButton').addEventListener('click',()=>render('Nexus AI',helpReply(),'nexus'));
document.getElementById('clearButton').addEventListener('click',()=>{conversation=[];localStorage.removeItem(CHAT_KEY);renderHistory()});
document.getElementById('clearMemoryButton').addEventListener('click',()=>{memory={prenom:'',ville:'',notes:[]};saveMemory();render('Nexus AI','C’est fait. 🧹🧠 Ma mémoire locale a été effacée.','nexus')});
renderHistory();
</script>
</body>
</html>
