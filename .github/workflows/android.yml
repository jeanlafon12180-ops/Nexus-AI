name: Build Nexus IA Android

on:
  workflow_dispatch:
  push:
    branches: [mobile-app]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Diagnose npm environment
        run: |
          node --version
          npm --version
          npm config get registry
          npm view @capacitor/core@8.5.2 version
          npm view @capacitor/cli@8.5.2 version
          npm view @capacitor/android@8.5.2 version
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm install --verbose --no-audit --no-fund 2>&1 | tee npm-install.log
      - name: Upload npm diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ia-npm-install-log
          path: npm-install.log
      - name: Check Capacitor
        run: npx cap --version
      - name: Generate Android project
        shell: bash
        run: |
          set -o pipefail
          npx cap add android --verbose 2>&1 | tee capacitor-add-android.log
      - name: Upload Android diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ia-capacitor-android-log
          path: capacitor-add-android.log
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ia-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
