name: Prepare Nexus IA iOS

on:
  workflow_dispatch:
  push:
    branches: [mobile-app]

jobs:
  ios:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnose npm environment
        run: |
          node --version
          npm --version
          npm config get registry
          npm view @capacitor/core@8.5.2 version
          npm view @capacitor/cli@8.5.2 version
          npm view @capacitor/ios@8.5.2 version
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm install --verbose --no-audit --no-fund 2>&1 | tee npm-install.log
      - name: Upload npm diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ia-npm-install-log
          path: npm-install.log
      - name: Check Capacitor
        run: npx cap --version
      - name: Generate iOS project
        run: npx cap add ios --packagemanager SPM --verbose
      - name: Sync Capacitor
        run: npx cap sync ios
      - name: Verify Xcode project
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ia-ios-project
          path: ios
